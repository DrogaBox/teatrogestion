[package]
name = "gestion-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Shell Tauri v2 multiplataforma (Windows Desktop + Android ARM64 Samsung Galaxy A53) para TeatroGestión"

[lib]
name = "gestion_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
gestion-core = { path = "../gestion-core" }
gestion-license = { path = "../gestion-license" }
gestion-update = { path = "../gestion-update" }
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }

[features]
default = []
enforce-license = ["gestion-license/enforce-license"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
